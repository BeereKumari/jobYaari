<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480">
  <!-- White paper background -->
  <rect width="640" height="480" fill="#ffffff"/>
  <!-- Outer border -->
  <rect x="8" y="8" width="624" height="464" fill="none" stroke="#1a3a6b" stroke-width="3"/>
  <rect x="14" y="14" width="612" height="452" fill="none" stroke="#c41e3a" stroke-width="1.5"/>
  
  <!-- Government header emblem area -->
  <circle cx="100" cy="60" r="30" fill="none" stroke="#1a3a6b" stroke-width="2"/>
  <text x="100" y="65" text-anchor="middle" font-family="Arial" font-size="10" fill="#1a3a6b" font-weight="bold">GOVT</text>
  <text x="320" y="45" text-anchor="middle" font-family="Arial" font-size="14" fill="#1a3a6b" font-weight="bold">UNION PUBLIC SERVICE COMMISSION</text>
  <text x="320" y="62" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">भारत सरकार | Government of India</text>
  <line x1="40" y1="75" x2="600" y2="75" stroke="#1a3a6b" stroke-width="1"/>
  
  <!-- Admit Card Title -->
  <rect x="120" y="90" width="400" height="36" rx="4" fill="#1a3a6b"/>
  <text x="320" y="114" text-anchor="middle" font-family="Arial" font-size="18" fill="white" font-weight="bold">ADMIT CARD / HALL TICKET</text>
  
  <!-- NDA Exam Details -->
  <text x="320" y="148" text-anchor="middle" font-family="Arial" font-size="16" fill="#c41e3a" font-weight="bold">NATIONAL DEFENCE ACADEMY (NDA) EXAMINATION, 2026</text>
  <text x="320" y="168" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">Exam Date: 14th April 2026 | Time: 9:00 AM - 12:00 PM</text>
  
  <!-- Candidate Details Table -->
  <rect x="60" y="185" width="520" height="140" fill="#f5f7fa" stroke="#ddd" stroke-width="1" rx="4"/>
  <text x="80" y="210" font-family="Arial" font-size="11" fill="#666">Candidate Name: </text>
  <text x="200" y="210" font-family="Arial" font-size="12" fill="#1a3a6b" font-weight="bold">RAJESH KUMAR SINGH</text>
  <text x="80" y="235" font-family="Arial" font-size="11" fill="#666">Roll Number: </text>
  <text x="180" y="235" font-family="Arial" font-size="12" fill="#1a3a6b" font-weight="bold">NDA-2026-045892</text>
  <text x="80" y="260" font-family="Arial" font-size="11" fill="#666">Exam Center: </text>
  <text x="180" y="260" font-family="Arial" font-size="12" fill="#333">Delhi Public School, New Delhi</text>
  <text x="80" y="285" font-family="Arial" font-size="11" fill="#666">Reporting Time: </text>
  <text x="200" y="285" font-family="Arial" font-size="12" fill="#c41e3a" font-weight="bold">7:30 AM (Mandatory)</text>
  
  <!-- Photo placeholder -->
  <rect x="470" y="195" width="90" height="110" fill="#e8ecef" stroke="#ccc" stroke-width="1" rx="2"/>
  <text x="515" y="245" text-anchor="middle" font-family="Arial" font-size="9" fill="#999">Passport</text>
  <text x="515" y="258" text-anchor="middle" font-family="Arial" font-size="9" fill="#999">Photo</text>
  
  <!-- Important Instructions -->
  <text x="60" y="350" font-family="Arial" font-size="13" fill="#c41e3a" font-weight="bold">Important Instructions:</text>
  <text x="60" y="368" font-family="Arial" font-size="10" fill="#555">▸ Bring original Aadhaar Card &amp; 2 passport size photographs</text>
  <text x="60" y="384" font-family="Arial" font-size="10" fill="#555">▸ No electronic devices, calculators or smartwatches allowed</text>
  <text x="60" y="400" font-family="Arial" font-size="10" fill="#555">▸ Candidate must report 90 minutes before exam start time</text>
  
  <!-- Footer -->
  <rect x="40" y="420" width="560" height="36" rx="4" fill="#f0f4f8"/>
  <text x="320" y="442" text-anchor="middle" font-family="Arial" font-size="10" fill="#1a73e8">upsc.gov.in | Helpline: 1800-XXX-XXXX</text>
</svg>
