<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480">
  <!-- White paper background -->
  <rect width="640" height="480" fill="#ffffff"/>
  <!-- Outer border -->
  <rect x="8" y="8" width="624" height="464" fill="none" stroke="#1a3a6b" stroke-width="3"/>
  <rect x="14" y="14" width="612" height="452" fill="none" stroke="#f97316" stroke-width="1.5"/>
  
  <!-- Government header -->
  <circle cx="80" cy="55" r="28" fill="none" stroke="#1a3a6b" stroke-width="2"/>
  <text x="80" y="55" text-anchor="middle" font-family="Arial" font-size="8" fill="#1a3a6b" font-weight="bold">INDIA</text>
  <text x="80" y="65" text-anchor="middle" font-family="Arial" font-size="7" fill="#1a3a6b">GOVT</text>
  <text x="320" y="40" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a3a6b" font-weight="bold">GOVERNMENT OF INDIA</text>
  <text x="320" y="56" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">भारत सरकार | Ministry of MSME &amp; Rural Development</text>
  <line x1="40" y1="70" x2="600" y2="70" stroke="#1a3a6b" stroke-width="1"/>
  
  <!-- Scheme Title -->
  <rect x="60" y="85" width="520" height="42" rx="4" fill="#f97316"/>
  <text x="320" y="102" text-anchor="middle" font-family="Arial" font-size="12" fill="white">Pradhan Mantri</text>
  <text x="320" y="120" text-anchor="middle" font-family="Arial" font-size="16" fill="white" font-weight="bold">VISHWAKARMA YOJANA 2026</text>
  
  <!-- Scheme Tagline -->
  <text x="320" y="148" text-anchor="middle" font-family="Arial" font-size="11" fill="#888" font-style="italic">Empowering Traditional Artisans &amp; Craftspeople Across India</text>
  
  <!-- Benefits Box -->
  <text x="60" y="175" font-family="Arial" font-size="13" fill="#1a3a6b" font-weight="bold">Scheme Benefits:</text>
  
  <!-- Benefit Cards in grid -->
  <!-- Row 1 -->
  <rect x="60" y="185" width="245" height="70" fill="#fff3e0" stroke="#ffcc80" stroke-width="1" rx="6"/>
  <text x="80" y="210" font-family="Arial" font-size="20" fill="#f97316">₹</text>
  <text x="100" y="210" font-family="Arial" font-size="13" fill="#1a3a6b" font-weight="bold">Financial Assistance</text>
  <text x="100" y="230" font-family="Arial" font-size="11" fill="#555">Up to Rs. 3 Lakh Loan</text>
  <text x="100" y="246" font-family="Arial" font-size="10" fill="#888">at 5% interest rate</text>
  
  <rect x="335" y="185" width="245" height="70" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1" rx="6"/>
  <text x="355" y="210" font-family="Arial" font-size="20" fill="#2e7d32">🛠</text>
  <text x="375" y="210" font-family="Arial" font-size="13" fill="#1a3a6b" font-weight="bold">Toolkit Incentive</text>
  <text x="375" y="230" font-family="Arial" font-size="11" fill="#555">Rs. 15,000 provided</text>
  <text x="375" y="246" font-family="Arial" font-size="10" fill="#888">for modern tools</text>
  
  <!-- Row 2 -->
  <rect x="60" y="265" width="245" height="70" fill="#e3f2fd" stroke="#90caf9" stroke-width="1" rx="6"/>
  <text x="80" y="290" font-family="Arial" font-size="20" fill="#1a73e8">📚</text>
  <text x="100" y="290" font-family="Arial" font-size="13" fill="#1a3a6b" font-weight="bold">Skill Training</text>
  <text x="100" y="310" font-family="Arial" font-size="11" fill="#555">Free 5-day basic training</text>
  <text x="100" y="326" font-family="Arial" font-size="10" fill="#888">+ Rs. 500/day stipend</text>
  
  <rect x="335" y="265" width="245" height="70" fill="#f3e5f5" stroke="#ce93d8" stroke-width="1" rx="6"/>
  <text x="355" y="290" font-family="Arial" font-size="20" fill="#8b5cf6">📋</text>
  <text x="375" y="290" font-family="Arial" font-size="13" fill="#1a3a6b" font-weight="bold">Market Support</text>
  <text x="375" y="310" font-family="Arial" font-size="11" fill="#555">Digital marketing &amp; branding</text>
  <text x="375" y="326" font-family="Arial" font-size="10" fill="#888">assistance provided</text>
  
  <!-- Eligibility -->
  <text x="60" y="365" font-family="Arial" font-size="13" fill="#c41e3a" font-weight="bold">Eligibility:</text>
  <text x="160" y="365" font-family="Arial" font-size="12" fill="#333">Age 18+ years | Traditional artisan community | Valid Aadhaar Card</text>
  
  <!-- 18 Trades -->
  <text x="60" y="390" font-family="Arial" font-size="11" fill="#555" font-weight="bold">18 Trades Covered:</text>
  <text x="60" y="406" font-family="Arial" font-size="10" fill="#666">Carpenter  Blacksmith  Goldsmith  Potter  Mason  Cobbler  Tailor  Painter  Barber  Sculptor  Basket Maker  Dhobi  Locksmith  Garland Maker  Stone Breaker  Hammer &amp; Tool Maker  Doll &amp; Toy Maker  Washing Machine Repair</text>
  
  <!-- Register Button -->
  <rect x="440" y="420" width="140" height="36" rx="6" fill="#f97316"/>
  <text x="510" y="443" text-anchor="middle" font-family="Arial" font-size="13" fill="white" font-weight="bold">Register Now →</text>
</svg>
